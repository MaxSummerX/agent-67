[project]
name = "agent-67"
version = "0.4.0"
description = "Минималистичный LLM-агент на чистом Python: свой цикл tool-calling, OpenRouter/Ollama/GigaChat, без фреймворков"
readme = "README.md"
authors = [
    { name = "MaxSummerX", email = "marspowerpops@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
  "httpx2==2.12.0",
  "ddgs==9.16",
  "python-dotenv==1.2.3",
  "rich==15.0.0",
  "readability-lxml==0.9",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.7",
    "pre-commit==4.3.0",
    "bandit==1.9.4",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["venv", ".venv", ".git", "__pycache__" ]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ASYNC",# asyncio
]
ignore = ["E203", "E266", "E501", "B008"]

[tool.ruff.lint.isort]
force-single-line = false
force-sort-within-sections = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    '\.venv',
    'venv',
    '__pycache__',
    'docs',
    'tests'
]

[[tool.mypy.overrides]]
module = ["readability"]
ignore_missing_imports = true
